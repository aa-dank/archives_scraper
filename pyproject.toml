[project]
name = "archives-scraper"
version = "1.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.5",
    "click>=8.4.1",
    "cobble>=0.1.4",
    "et-xmlfile>=2.0.0",
    "extract-msg>=0.55.0",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "mammoth>=1.12.0",
    "markdown>=3.10.2",
    "numpy>=2.4.6",
    "ocrmypdf>=17.5.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.4.2",
    "pillow>=12.2.0",
    "psycopg>=3.3.4",
    "pymupdf>=1.27.2.3",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "sentence-transformers>=5.5.1",
    "sqlalchemy>=2.0.50",
    "torch>=2.12.0",
    "unidecode>=1.4.0",
    "xlsxwriter>=3.2.9",
]

[tool.setuptools]
packages = ["db", "embedding", "text_extraction"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
